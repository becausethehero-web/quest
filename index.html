<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Секретное послание</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #111;
      --text: #eee;
      --muted: #a6a6a6;
      --accent: #c8b98b;
      --line: #48443a;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(18px, env(safe-area-inset-bottom));
      display: flex;
      background:
        radial-gradient(ellipse at center, #25231f 0%, var(--background) 72%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: 100%;
      max-width: 560px;
      min-height: calc(100vh - 36px);
      min-height: calc(100svh - max(36px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      margin: auto;
      padding: clamp(28px, 7vh, 64px) clamp(20px, 6vw, 34px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid var(--line);
      background: rgba(20, 20, 20, 0.94);
      box-shadow: 0 12px 45px rgba(0, 0, 0, .35);
      text-align: center;
    }

    .classification {
      margin: 0 0 clamp(20px, 5vh, 38px);
      color: var(--accent);
      font: 11px/1.6 Arial, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .divider {
      flex: 0 0 1px;
      width: 54px;
      margin: clamp(18px, 4vh, 30px) auto;
      background: var(--accent);
      opacity: .75;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(24px, 6vw, 32px);
      font-weight: normal;
      line-height: 1.3;
    }

    .message {
      margin: clamp(20px, 5vh, 34px) 0;
      font-size: clamp(19px, 5vw, 23px);
      line-height: 1.7;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .footer {
      margin: clamp(18px, 4vh, 30px) 0 0;
      color: var(--muted);
      font: 10px/1.6 Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .error h1 { color: #ddd; }
    .error .message { color: var(--muted); font-size: 17px; }

    @media (min-width: 700px) {
      body { justify-content: center; }
      main {
        min-height: min(760px, calc(100vh - 48px));
        border-radius: 2px;
      }
    }

    @media (max-height: 600px) {
      main { padding-top: 20px; padding-bottom: 20px; }
      .classification { margin-bottom: 12px; }
      .divider { margin-top: 12px; margin-bottom: 12px; }
      .message { margin-top: 14px; margin-bottom: 14px; line-height: 1.5; }
      .footer { margin-top: 12px; }
    }
  </style>
</head>
<body>
  <main id="page">
    <p class="classification">Закрытый архив · Доступ по приглашению</p>
    <div class="divider"></div>
    <h1 id="heading">Секретное послание</h1>
    <p class="message" id="message">Загрузка сообщения…</p>
    <div class="divider"></div>
    <p class="footer" id="footer">Материал предназначен только для адресата</p>
  </main>

  <script>
    /*
      КАК МЕНЯТЬ ЗАГАДКИ:
      1. Замените текст в title и text ниже.
      2. Не меняйте номера 1–5: они используются в QR-ссылках.
      3. Перенос строки внутри текста обозначается как \n.
    */

    const QUEST = {
      "1": {
        title: "Послание № 1",
        text: "ЗАМЕНИТЕ ЭТОТ ТЕКСТ ПЕРВОЙ ЗАГАДКОЙ"
      },
      "2": {
        title: "Послание № 2",
        text: "ЗАМЕНИТЕ ЭТОТ ТЕКСТ ВТОРОЙ ЗАГАДКОЙ"
      },
      "3": {
        title: "Послание № 3",
        text: "ЗАМЕНИТЕ ЭТОТ ТЕКСТ ТРЕТЬЕЙ ЗАГАДКОЙ"
      },
      "4": {
        title: "Послание № 4",
        text: "ЗАМЕНИТЕ ЭТОТ ТЕКСТ ЧЕТВЁРТОЙ ЗАГАДКОЙ"
      },
      "5": {
        title: "Послание № 5",
        text: "ЗАМЕНИТЕ ЭТОТ ТЕКСТ ПЯТОЙ ЗАГАДКОЙ"
      }
    };

    const id = window.location.hash.slice(1);
    const page = document.getElementById("page");
    const heading = document.getElementById("heading");
    const message = document.getElementById("message");
    const footer = document.getElementById("footer");
    const item = QUEST[id];

    if (item) {
      heading.textContent = item.title;
      message.textContent = item.text;
    } else {
      page.classList.add("error");
      heading.textContent = "Сообщение не найдено";
      message.textContent =
        "Проверьте QR-код или адрес ссылки. В конце адреса должна быть цифра от 1 до 5.";
      footer.textContent = "Доступ отсутствует";
    }
  </script>
</body>
</html>
